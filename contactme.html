<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">

    <!-- Browser tab icon -->
    <link rel="icon" type="image/png" href="images/logo.jpg">

    <!-- JavaScript -->
    <script src="jqm.js"></script>

    <!-- Page title -->
    <title>Afruza's Portfolio</title>
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="topnav" id="myTopnav">

            <!-- Logo -->
            <a href="index.html" class="logo">
                <img src="images/logo.jpg" alt="Afruza logo">
            </a>

            <!-- Navigation links -->
            <div class="nav-links">

                <a href="index.html">
                    <i class="fa fa-home"></i>
                    Home
                </a>

                <a href="aboutme.html">
                    <i class="fa fa-user"></i>
                    About Me
                </a>

                <a href="projects.html">
                    <i class="fa fa-suitcase"></i>
                    Projects
                </a>

                <a href="contactme.html" class="active">
                    <i class="fa fa-envelope"></i>
                    Contact
                </a>

            </div>

            <!-- Mobile hamburger menu -->
            <a href="javascript:void(0);" class="icon" onclick="myFunction()">
                <i class="fa fa-bars"></i>
            </a>

        </nav>
    </header>


    <main>

        <!-- Contact -->
        <section class="contact-section">

            <div class="contact-content">

                <!-- Contact -->
                <div class="contact-method">

                    <i class="fa fa-envelope"></i>

                    <h2>Email Me</h2>

                    <p>
                        If you would like to get in touch with me, you can send me an email
                        using the button below.
                    </p>

                    <a href="https://mail.google.com/mail/?view=cm&fs=1&to=afruza.bhuiyan@gmail.com"
                        class="contact-button"
                        target="_blank"
                        rel="noopener noreferrer">
                            Send Me an Email
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>
            Social media:
            <a href="https://github.com/afruza-bhuiyan"
               target="_blank"
               rel="noopener noreferrer">
                <i class="fa fa-github"></i>
            </a>
            <br>
            Page designed and created by Afruza.
            <br>
            All rights are reserved.
        </p>
    </footer>


    <!-- Mobile navigation JavaScript -->
    <script>
        function myFunction() {
            var x = document.getElementById("myTopnav");

            if (x.className === "topnav") {
                x.className += " responsive";
            } else {
                x.className = "topnav";
            }
        }
    </script>

</body>
</html>
